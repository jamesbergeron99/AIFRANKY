<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank | Studio Executive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #070708; font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-4xl flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-700 to-rose-800 flex items-center justify-center shadow-xl">
                <i data-lucide="film" class="text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-amber-500">Frank</h1>
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest">Studio Executive & Mentor</p>
            </div>
        </div>
        <button id="settingsBtn" class="text-zinc-500 hover:text-amber-500 transition-colors">
            <i data-lucide="settings"></i>
        </button>
    </header>

    <div id="settingsPanel" class="hidden w-full max-w-4xl mb-6 p-6 bg-zinc-900 border border-zinc-800 rounded-3xl">
        <label class="block text-[10px] uppercase tracking-widest text-zinc-500 mb-2">Gemini API Key</label>
        <input type="password" id="apiKeyInput" class="w-full bg-zinc-950 border border-zinc-800 p-3 rounded-xl text-amber-500" value="AIzaSyBqfJ2ycARf8XKSjmIywZKHYf1KUcrxv8M">
    </div>

    <main class="w-full max-w-4xl bg-zinc-900/50 border border-zinc-800 rounded-3xl p-6 flex flex-col h-[500px] mb-6">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-6 pr-2 scrollbar-hide">
            <div class="flex justify-start">
                <div class="max-w-[85%] p-5 bg-zinc-800 border border-zinc-700 rounded-3xl rounded-tl-none italic text-zinc-300">
                    My dear, I've poured a drink and I'm ready for some serious work. Hand me your pages. Let's find the brilliance.
                </div>
            </div>
        </div>
        <div id="loadingStatus" class="hidden text-amber-600 text-xs italic mt-4 animate-pulse">Frank is reading with his red pen...</div>
    </main>

    <div class="w-full max-w-4xl flex gap-3">
        <input type="text" id="userInput" placeholder="What's the word in Hollywood?" class="flex-1 bg-zinc-900 border border-zinc-800 p-5 rounded-2xl focus:outline-none focus:ring-1 focus:ring-amber-500">
        <button id="sendBtn" class="bg-amber-600 hover:bg-amber-700 p-5 rounded-2xl text-white transition-all active:scale-95">
            <i data-lucide="send"></i>
        </button>
        <label class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl cursor-pointer hover:text-amber-500 transition-colors">
            <i data-lucide="upload"></i>
            <input type="file" id="fileInput" class="hidden" accept=".txt,.pdf">
        </label>
    </div>

    <audio id="frankVoice"></audio>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const loadingStatus = document.getElementById('loadingStatus');
        const frankVoice = document.getElementById('frankVoice');

        settingsBtn.onclick = () => settingsPanel.classList.toggle('hidden');

        async function handleSend(customText = null) {
            const text = customText || userInput.value;
            if (!text.trim()) return;

            if (!customText) {
                appendMessage('user', text);
                userInput.value = '';
            }

            loadingStatus.classList.remove('hidden');

            try {
                const apiKey = document.getElementById('apiKeyInput').value;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: `You are Frank, a queer movie executive with 30 years experience. You are articulate, sophisticated, and witty. MISSION: MENTOR. If a script is provided, give a deep 5-part analysis (Impression, Structure, Character, Dialogue, Strategy). Use "My dear" and "Darling". Sound helpful and seasoned.` }] }
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                appendMessage('assistant', aiText);
                await playVoice(aiText, apiKey);
            } catch (err) {
                appendMessage('assistant', "Darling, the connection is fragile. Shall we try again?");
            } finally {
                loadingStatus.classList.add('hidden');
            }
        }

        async function playVoice(text, key) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say this as Frank: ${text}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    })
                });
                const result = await res.json();
                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                frankVoice.src = `data:audio/wav;base64,${audioData}`;
                frankVoice.play();
            } catch (e) { console.error("Voice error", e); }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[85%] p-5 rounded-3xl ${role === 'user' ? 'bg-amber-800 text-white rounded-tr-none' : 'bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-tl-none leading-relaxed'}">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.onclick = () => handleSend();
        userInput.onkeydown = (e) => e.key === 'Enter' && handleSend();

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => handleSend(`[UPLOADED SCRIPT: ${file.name}]\n\n${event.target.result}`);
            reader.readAsText(file);
        };
    </script>
</body>
</html>
