<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank | Studio Executive (InWorld)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #070708; font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-4xl flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-700 to-rose-800 flex items-center justify-center shadow-xl">
                <i data-lucide="film" class="text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-amber-500">Frank</h1>
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest">InWorld Powered • Studio Mentor</p>
            </div>
        </div>
        <button id="settingsBtn" class="text-zinc-500 hover:text-amber-500 transition-colors">
            <i data-lucide="settings"></i>
        </button>
    </header>

    <div id="settingsPanel" class="hidden w-full max-w-4xl mb-6 p-6 bg-zinc-900 border border-zinc-800 rounded-3xl space-y-4">
        <div>
            <label class="block text-[10px] uppercase tracking-widest text-zinc-500 mb-2">Gemini API Key (The Brain)</label>
            <input type="password" id="geminiKey" class="w-full bg-zinc-950 border border-zinc-800 p-3 rounded-xl text-amber-500" placeholder="Paste Gemini Key Here">
        </div>
        <div>
            <label class="block text-[10px] uppercase tracking-widest text-zinc-500 mb-2">InWorld API Key (The Voice)</label>
            <input type="password" id="inworldKey" class="w-full bg-zinc-950 border border-zinc-800 p-3 rounded-xl text-blue-400" placeholder="Paste InWorld Key Here">
        </div>
    </div>

    <main class="w-full max-w-4xl bg-zinc-900/50 border border-zinc-800 rounded-3xl p-6 flex flex-col h-[500px] mb-6 shadow-2xl">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-6 pr-2 scrollbar-hide">
            <div class="flex justify-start">
                <div class="max-w-[85%] p-5 bg-zinc-800 border border-zinc-700 rounded-3xl rounded-tl-none italic text-zinc-300">
                    My dear, I've got the InWorld deck ready. Let's hear what your script has to say today.
                </div>
            </div>
        </div>
        <div id="loadingStatus" class="hidden text-amber-600 text-xs italic mt-4 animate-pulse">Frank is analyzing...</div>
    </main>

    <div class="w-full max-w-4xl flex gap-3 items-center">
        <input type="text" id="userInput" placeholder="What's the word in Hollywood?" class="flex-1 bg-zinc-900 border border-zinc-800 p-5 rounded-2xl focus:outline-none focus:ring-1 focus:ring-amber-500">
        
        <button id="micBtn" class="bg-zinc-800 hover:bg-zinc-700 p-5 rounded-2xl text-zinc-400 transition-all active:scale-95">
            <i data-lucide="mic"></i>
        </button>

        <button id="sendBtn" class="bg-amber-600 hover:bg-amber-700 p-5 rounded-2xl text-white transition-all active:scale-95">
            <i data-lucide="send"></i>
        </button>

        <label class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl cursor-pointer hover:text-amber-500 transition-colors">
            <i data-lucide="upload"></i>
            <input type="file" id="fileInput" class="hidden" accept=".txt,.pdf">
        </label>
    </div>

    <audio id="frankVoice"></audio>

    <script>
        lucide.createIcons();

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const loadingStatus = document.getElementById('loadingStatus');
        const frankVoice = document.getElementById('frankVoice');

        settingsBtn.onclick = () => settingsPanel.classList.toggle('hidden');

        // Speech-to-Text
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            micBtn.onclick = () => { recognition.start(); micBtn.classList.add('text-amber-500'); };
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleSend(); };
            recognition.onend = () => micBtn.classList.remove('text-amber-500');
        }

        async function handleSend(customText = null) {
            const text = customText || userInput.value;
            const gKey = document.getElementById('geminiKey').value;
            const iKey = document.getElementById('inworldKey').value;

            if (!text.trim() || !gKey) {
                alert("Please ensure Gemini Key is entered in settings.");
                return;
            }

            if (!customText) { appendMessage('user', text); userInput.value = ''; }
            loadingStatus.classList.remove('hidden');

            try {
                // BRAIN: Gemini 1.5 Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: "You are Frank, a queer movie executive. Be articulate, witty, and mentor-like. Give long 5-part script analysis. Use 'My dear' and 'Darling'." }] }
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                appendMessage('assistant', aiText);

                // VOICE: InWorld (Clive)
                if (iKey) { await playInWorldVoice(aiText, iKey); }
            } catch (err) {
                appendMessage('assistant', "Connection dropped, darling. Let's try again.");
            } finally {
                loadingStatus.classList.add('hidden');
            }
        }

        async function playInWorldVoice(text, key) {
            try {
                // This targets the InWorld Studio TTS endpoint for the Clive voice
                const res = await fetch(`https://api.inworld.ai/v1/tts:synthesize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'authorization': `basic ${key}` },
                    body: JSON.stringify({
                        text: text,
                        voice: "clive" 
                    })
                });
                const result = await res.json();
                if (result.audio) {
                    frankVoice.src = `data:audio/mp3;base64,${result.audio}`;
                    frankVoice.play();
                }
            } catch (e) { console.error("InWorld Voice Error", e); }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[85%] p-5 rounded-3xl ${role === 'user' ? 'bg-amber-800 text-white' : 'bg-zinc-800 text-zinc-200'}">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.onclick = () => handleSend();
        userInput.onkeydown = (e) => e.key === 'Enter' && handleSend();

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => handleSend(`[UPLOADED SCRIPT: ${file.name}]\n\n${event.target.result}`);
            reader.readAsText(file);
        };
    </script>
</body>
</html>
